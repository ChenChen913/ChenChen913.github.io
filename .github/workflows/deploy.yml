name: Deploy Jekyll site

on:
  push:
    branches: [main]

# 同一时刻只允许一个 Pages 部署，防止旧构建后完成反而覆盖新构建的竞态。
# cancel-in-progress 设为 false（GitHub Pages 官方模板配置）：
# 不取消进行中的生产部署，让其跑完，新触发的部署排队等待。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      # 链接/产物校验：检查内部死链与图片 alt 缺失等，防止内容性回归。
      # 设为非阻断（continue-on-error）：校验失败只告警不卡部署，便于逐步治理历史问题。
      - name: Check internal links (non-blocking)
        continue-on-error: true
        run: |
          gem install html-proofer --no-document
          htmlproofer ./_site --disable-external --allow-missing-href --no-enforce-https --assume-extension

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
