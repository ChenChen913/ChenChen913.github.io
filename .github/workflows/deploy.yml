name: Deploy Jekyll site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'   # 每周一 03:00 UTC 触发外部链接巡检
  workflow_dispatch:       # 手动触发：默认只跑外链巡检；勾选 deploy 则强制重新部署
    inputs:
      deploy:
        description: 强制重新部署站点（勾选后跳过外链巡检）
        type: boolean
        required: false
        default: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # push 或手动勾选 deploy 时部署；定时/默认手动只跑外链巡检
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    # 同一时刻只允许一个 Pages 部署，防止旧构建后完成反而覆盖新构建的竞态。
    # cancel-in-progress 设为 false（GitHub Pages 官方模板配置）：
    # 不取消进行中的生产部署，让其跑完，新触发的部署排队等待。
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # action 固定到完整 commit SHA，防止可变主版本标签被重定向/攻破后获得部署级权限
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # 完整历史：portfolio 同步检查需要按路径查询提交日期

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3.12'
          bundler-cache: true

      - name: Static checks
        run: |
          node --check script.js
          ruby -e 'require "yaml"; Dir["_data/**/*.yml", "_data/**/*.yaml", "_config.yml"].each { |f| YAML.safe_load_file(f, permitted_classes: [], aliases: false) }; puts "YAML OK"'

      - name: Check portfolio sync freshness
        run: python check_portfolio_sync.py

      # 本站为用户名级站点（chenchen913.github.io），baseurl 为空，
      # 构建产物即部署在域名根，无需 actions/configure-pages / --baseurl。
      - name: Build site
        run: |
          bundle exec jekyll build
          # 移除 github-pages gem 默认主题(minima)自动生成的未引用样式表 assets/css/style.css
          # （约 136KB 死重量，本站实际使用根目录 style.css）。若未来新增真正的 assets/css 资源请删除本行。
          rm -f _site/assets/css/style.css

      # 链接/产物校验：检查内部死链与图片 alt 缺失等，防止内容性回归。
      # 阻断式：任何死链或 alt 缺失都会让部署失败。
      # 注：html-proofer 5.x 移除了 --assume-extension（jekyll 目录型 permalink 默认即按 index.html 解析）。
      # 注：--disable-external 为有意取舍——外部站点（X/GitHub 等）的反爬策略会导致误报，
      #     外链有效性由下方 check-external-links 定时/手动巡检（不阻断本部署）。
      - name: Check internal links (blocking)
        run: |
          bundle exec htmlproofer ./_site --disable-external --allow-missing-href --no-enforce-https

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  # 外部链接巡检：仅定时/手动触发，独立于部署（不阻断 Pages）。
  # 部署流水线仍 --disable-external，避免外部站点反爬导致部署误失败。
  check-external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy != 'true')
    # 巡检与部署互不排队：只读任务独立 concurrency group
    concurrency:
      group: "pages-links"
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build
      - name: Check external links (non-blocking for deploy)
        run: bundle exec htmlproofer ./_site --allow-missing-href --no-enforce-https
