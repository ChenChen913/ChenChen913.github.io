<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — 页面未找到</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161A" media="(prefers-color-scheme: dark)">
<!-- 主题初始化 + 语言检测（与主站逻辑一致） -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    var m = location.search.match(/[?&]lang=(zh|en)/);
    var lang = m ? m[1] : ((navigator.language || "zh").indexOf("en") > -1 ? "en" : "zh");
    document.documentElement.setAttribute("lang", lang === "en" ? "en" : "zh-CN");
    document.documentElement.classList.add("lang-" + lang);
  })();
</script>
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
<style>
  .nf-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .nf-card { text-align: center; max-width: 420px; }
  .nf-code { font-family: Georgia, "Songti SC", "STSong", serif; font-size: 96px; font-weight: 700; line-height: 1; color: var(--accent); margin-bottom: 12px; }
  .nf-title { font-size: 20px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
  .nf-desc { font-size: 15px; color: var(--ink-secondary); margin-bottom: 28px; line-height: 1.7; }
  .nf-btn { display: inline-block; padding: 10px 24px; background: var(--accent); color: #fff; border-radius: 8px; text-decoration: none; font-size: 14px; }
  .nf-btn:hover { text-decoration: none; opacity: 0.9; }
  .nf-en { display: none; }
  html.lang-en .nf-zh { display: none; }
  html.lang-en .nf-en { display: block; }
</style>
</head>
<body>
<div class="nf-wrap">
  <div class="nf-card">
    <div class="nf-code">404</div>
    <div class="nf-title nf-zh">页面未找到</div>
    <div class="nf-title nf-en">Page Not Found</div>
    <p class="nf-desc nf-zh">你访问的页面不存在，可能已被移动或删除。</p>
    <p class="nf-desc nf-en">The page you're looking for doesn't exist or may have been moved.</p>
    <a href="{{ '/index.html' | relative_url }}" class="nf-btn nf-zh">返回主页</a>
    <a href="{{ '/index.html' | relative_url }}" class="nf-btn nf-en">Back to Home</a>
  </div>
</div>
</body>
</html>
