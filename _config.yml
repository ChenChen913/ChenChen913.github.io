# Jekyll 站点配置

title: 王晨 · 个人主页
description: 王晨的个人主页
url: "https://chenchen913.github.io"
baseurl: ""

# 插件（github-pages gem 内置白名单）
plugins:
  - jekyll-sitemap

# 集合
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  projects:
    output: true
    permalink: /:collection/:path/

# 默认布局
defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: detail
  - scope:
      path: ""
      type: "projects"
    values:
      layout: detail

# Markdown 处理
markdown: kramdown
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
kramdown:
  input: GFM

# 排除
exclude:
  - backups/
  - index_empty.html
  - portfolio-single-file.html
  - vendor/
  - DEPLOY.md
  - TROUBLESHOOTING.md
  - DEPLOY-OPTIONS.md
  - RUBY-JEKYLL.md
  - CONTENT-GUIDE.md
  - update-date.py
  - backup.ps1
  - README.md
  - README_EN.md
  - LICENSE
  - .workbuddy/

# 保留
keep_files:
  - .git
