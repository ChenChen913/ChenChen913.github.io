# Jekyll 站点配置

title: 王晨 · 个人主页
description: 王晨的个人主页
url: "https://chenchen913.github.io"
baseurl: ""

# 插件（github-pages gem 内置白名单）
plugins:
  - jekyll-sitemap

# 集合
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  projects:
    output: true
    permalink: /:collection/:path/

# 默认布局
defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: detail
  - scope:
      path: ""
      type: "projects"
    values:
      layout: detail

# Markdown 处理
markdown: kramdown
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
kramdown:
  input: GFM

# 下划线文件（_headers）的强制复制**不在这里配置**，而是放在 _config.cloudflare.yml。
#
# 原因：`include` 会同时作用于 GitHub Pages 的产物 _site，使
#   https://chenchen913.github.io/_headers
# 变成可公开下载的明文文件（2026-11-14 实测返回 200，1554 字节），内部注释与
# 安全策略取舍全部外泄。而 _headers 是 Cloudflare 专有机制，只应出现在 _site_cf。
#
# Jekyll 多配置合并时数组是整体替换（不是追加），所以：
#   GitHub Pages 构建（仅 _config.yml）→ 默认 include，不含 _headers ✔
#   Cloudflare 构建（追加 _config.cloudflare.yml）→ include: [_headers] ✔
# 详见 _config.cloudflare.yml。

# 排除
exclude:
  - backups/
  - _site_cf
  - __pycache__/
  - index_empty.html
  - portfolio-single-file.html
  - vendor/
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - DEPLOY.md
  - TROUBLESHOOTING.md
  - CONTENT-GUIDE.md
  - docs/
  - update-date.py
  - generate_assets.py
  - backup.ps1
  - check_portfolio_sync.py
  - requirements-ci.txt
  - README.md
  - README_EN.md
  - LICENSE
  - .workbuddy/
