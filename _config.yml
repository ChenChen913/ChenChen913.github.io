# Jekyll 站点配置

title: 王晨 · 个人主页
description: 王晨的个人主页
url: "https://chenchen913.github.io"
baseurl: ""

# 插件（github-pages gem 内置白名单）
plugins:
  - jekyll-sitemap

# 集合
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  projects:
    output: true
    permalink: /:collection/:path/

# 默认布局
defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: detail
  - scope:
      path: ""
      type: "projects"
    values:
      layout: detail

# Markdown 处理
markdown: kramdown
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
kramdown:
  input: GFM

# 需要强制复制的下划线文件。
# Jekyll 默认忽略所有以 _ 开头的文件，不写在这里的 _headers / _redirects
# 永远不会进入 _site，Cloudflare Pages 也就读不到——这是"配了却不生效"的典型原因。
# 注：GitHub Pages 会忽略这两个文件，不影响现有部署。
include:
  - _headers

# 排除
exclude:
  - backups/
  - index_empty.html
  - portfolio-single-file.html
  - vendor/
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - DEPLOY.md
  - TROUBLESHOOTING.md
  - CONTENT-GUIDE.md
  - AUDIT-REPORT.md
  - AUDIT-REPORT-2.md
  - AUDIT-REPORT-3.md
  - CLOUDFLARE_MIGRATION_GUIDE.md
  - docs/
  - update-date.py
  - generate_assets.py
  - backup.ps1
  - check_portfolio_sync.py
  - requirements-ci.txt
  - README.md
  - README_EN.md
  - LICENSE
  - .workbuddy/
