---
sitemap: false
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>PDF 查看器</title>
<!-- pdf.js 6.1.200 已自托管于 assets/pdfjs/（同源加载，无 CDN 可用性与供应链依赖） -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #525659;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: #323639;
    color: #ccc;
    font-size: 13px;
    user-select: none;
    -webkit-user-select: none;
  }
  #toolbar button, #toolbar a.btn {
    background: #565a5e;
    color: #fff;
    border: none;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    text-decoration: none;
    white-space: nowrap;
  }
  #toolbar button:hover, #toolbar a.btn:hover { background: #6c7176; }
  #toolbar button:disabled { opacity: 0.4; cursor: default; }
  #toolbar span { margin: 0 4px; }
  #toolbar .spacer { flex: 1; }
  #pages {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  canvas {
    display: block;
    margin: 0 auto;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  #loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 200px;
    color: #aaa;
    font-size: 14px;
    gap: 10px;
  }
  #progress-bar {
    width: 200px;
    height: 4px;
    background: #444;
    border-radius: 2px;
    overflow: hidden;
  }
  #progress-fill {
    width: 0%;
    height: 100%;
    background: #5a9fd4;
    border-radius: 2px;
    transition: width 0.3s;
  }
  #error {
    display: none;
    align-items: center;
    justify-content: center;
    height: 200px;
    color: #f88;
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }
  #error a { color: #8cf; }
</style>
</head>
<body>

<div id="toolbar">
  <button id="btn-prev" disabled>◀</button>
  <span id="page-num">—</span>
  <button id="btn-next" disabled>▶</button>
  <span class="spacer"></span>
  <button id="btn-zoomin" title="放大">＋</button>
  <button id="btn-zoomout" title="缩小">－</button>
  <a id="btn-download" class="btn" href="#" download>📥 下载</a>
  <a id="btn-fullscreen" class="btn" href="#" target="_blank" rel="noopener noreferrer">⛶ 全屏</a>
</div>

<div id="loading">
  <span id="loading-text">正在加载 PDF…</span>
  <div id="progress-bar"><div id="progress-fill"></div></div>
</div>
<div id="error">
  <span id="error-text"></span>
</div>
<div id="pages"></div>

<script type="module">
import * as pdfjsLib from './pdfjs/pdf.min.mjs';

pdfjsLib.GlobalWorkerOptions.workerSrc =
  './pdfjs/pdf.worker.min.mjs';

// 国际化：语言来自自身 ?lang= 参数，或嵌入本页的详情页 URL（referrer）
var I18N = {
  zh: { title: 'PDF 查看器', zoomin: '放大', zoomout: '缩小', download: '📥 下载', fullscreen: '⛶ 全屏',
        prev: '上一页', next: '下一页',
        loading: '正在加载 PDF…', nofile: '未指定 PDF 文件', invalid: 'PDF 地址不合法：仅支持本站 /assets/ 目录下的 PDF 文件。',
        pageloading: '加载中…', error: 'PDF 加载失败。', errorlink: '点击此处直接打开', htmllang: 'zh-CN' },
  en: { title: 'PDF Viewer', zoomin: 'Zoom in', zoomout: 'Zoom out', download: '📥 Download', fullscreen: '⛶ Fullscreen',
        prev: 'Previous page', next: 'Next page',
        loading: 'Loading PDF…', nofile: 'No PDF file specified', invalid: 'Invalid PDF URL: only same-site /assets/*.pdf files are supported.',
        pageloading: 'Loading…', error: 'Failed to load PDF.', errorlink: 'Click here to open it directly', htmllang: 'en' }
};
var lang = 'zh';
try {
  var sp = new URLSearchParams(location.search);
  var ml = sp.get('lang');
  if (!ml && document.referrer) ml = new URL(document.referrer).searchParams.get('lang');
  if (ml === 'zh' || ml === 'en') lang = ml;
} catch (e) {}
var T = I18N[lang];
document.documentElement.setAttribute('lang', T.htmllang);
document.title = T.title;
document.getElementById('btn-prev').title = T.prev;
document.getElementById('btn-prev').setAttribute('aria-label', T.prev);
document.getElementById('btn-next').title = T.next;
document.getElementById('btn-next').setAttribute('aria-label', T.next);
document.getElementById('btn-zoomin').title = T.zoomin;
document.getElementById('btn-zoomout').title = T.zoomout;
document.getElementById('btn-download').textContent = T.download;
document.getElementById('btn-fullscreen').textContent = T.fullscreen;
document.getElementById('loading-text').textContent = T.loading;

// 只允许同站 /assets/ 目录下的 PDF：拦截 javascript:/data:/外部 URL 等非法地址
function resolveLocalPdf(raw) {
  if (!raw || typeof raw !== 'string') return null;
  try {
    var u = new URL(raw, window.location.href);
    if (u.origin !== window.location.origin) return null;
    var path;
    try {
      path = decodeURIComponent(u.pathname);
    } catch (e) {
      return null; // 非法百分号编码
    }
    // 手工规范化 . 与 .. 段，防止 %2e/%2f 编码绕过 new URL 的字面规范化
    var parts = [];
    var ok = true;
    path.split('/').forEach(function (seg) {
      if (!ok) return;
      // 拒绝含反斜杠的段（部分服务器把 %5C 当路径分隔符）
      if (seg.indexOf('\\') !== -1) { ok = false; return; }
      if (seg === '..') {
        if (parts.length === 0) { ok = false; return; } // 越过根目录视为非法
        parts.pop();
      } else if (seg !== '.' && seg !== '') {
        parts.push(seg);
      }
    });
    if (!ok) return null;
    var normalized = '/' + parts.join('/');
    if (normalized.indexOf('/assets/') !== 0) return null;
    if (!/\.pdf$/i.test(normalized)) return null;
    // 拒绝规范化路径中残留的字面 ?/#（解码后会把 URL 截断成 query/fragment）
    if (normalized.indexOf('?') !== -1 || normalized.indexOf('#') !== -1) return null;
    // 逐段 encodeURIComponent 重新编码，保证 % / ? # 均按字面处理
    return '/' + parts.map(function (seg) { return encodeURIComponent(seg); }).join('/') + u.search;
  } catch (e) {
    return null;
  }
}

function showError(message, withLink) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'flex';
  var el = document.getElementById('error-text');
  el.innerHTML = '';
  el.appendChild(document.createTextNode(message));
  if (withLink) {
    el.appendChild(document.createElement('br'));
    var a = document.createElement('a');
    a.id = 'error-link';
    a.href = pdfUrl;
    a.textContent = T.errorlink;
    el.appendChild(a);
  }
}

var params = new URLSearchParams(location.search);
var rawFile = params.get('file');
var pdfUrl = rawFile ? resolveLocalPdf(rawFile) : null;

if (!rawFile) {
  showError(T.nofile, false);
  document.getElementById('progress-bar').style.display = 'none';
} else if (!pdfUrl) {
  // 非法地址：不设置下载/全屏/错误链接，避免 javascript: 等注入
  showError(T.invalid, false);
  document.getElementById('progress-bar').style.display = 'none';
  document.getElementById('btn-download').href = '#';
  document.getElementById('btn-fullscreen').href = '#';
} else {
  // 下载链接指向原始 PDF（已通过白名单校验）
  document.getElementById('btn-download').href = pdfUrl;
  // 全屏按钮打开当前查看器页面（而非原始 PDF），带上语言参数，避免手机端触发下载弹窗
  var q = location.search;
  var fsHref = location.pathname;
  if (q) {
    fsHref += q;
    if (q.indexOf('lang=') === -1) fsHref += '&lang=' + lang;
  } else {
    fsHref += '?lang=' + lang;
  }
  document.getElementById('btn-fullscreen').href = fsHref;
  init(pdfUrl);
}

var pdfDoc = null, pageNum = 1, totalPages = 0, scale = 1.2, currentRenderTask = null, renderToken = 0, _cleanupTimer = null;

function init(url) {
  var fill = document.getElementById('progress-fill');
  var text = document.getElementById('loading-text');

  var task = pdfjsLib.getDocument({
    url: url,
    disableAutoFetch: true,   // 只按需拉取页面，大幅加快首屏
    disableStream: false      // 启用流式加载，边下载边解析
  });

  // 显示下载进度
  task.onProgress = function(evt) {
    if (evt.total > 0) {
      var pct = Math.round(evt.loaded / evt.total * 100);
      fill.style.width = pct + '%';
      text.textContent = T.loading + ' ' + pct + '%';
    }
  };

  task.promise.then(function(pdf) {
    pdfDoc = pdf;
    totalPages = pdf.numPages;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('btn-prev').disabled = true;
    document.getElementById('btn-next').disabled = totalPages <= 1;
    document.getElementById('page-num').textContent = '1 / ' + totalPages;
    autoScale();
    renderPage(1);
  }).catch(function(err) {
    console.error(err);
    showError(T.error, true);
  });
}

// 页面离开时释放 pdf.js 文档对象（worker/字体缓存/进行中任务）
window.addEventListener('pagehide', function (e) {
  // bfcache 恢复时会保留 JS 状态：persisted 时不销毁，否则返回后查看器失效
  if (e.persisted) return;
  if (pdfDoc) {
    try { pdfDoc.destroy(); } catch (err) {}
    pdfDoc = null;
  }
});
window.addEventListener('pageshow', function (e) {
  if (e.persisted && !pdfDoc && pdfUrl) init(pdfUrl);
});

function autoScale() {
  var w = document.getElementById('pages').clientWidth;
  scale = Math.max(0.5, (w - 20) / 612); // 612 = US Letter 默认宽度（8.5in × 72dpi）
}

function renderPage(num) {
  if (!pdfDoc) return;
  // 新一轮渲染开始：隐藏错误横幅、取消挂起的延迟清理，避免与渲染竞争
  var errorEl = document.getElementById('error');
  if (errorEl) errorEl.style.display = 'none';
  clearTimeout(_cleanupTimer);
  var token = ++renderToken; // 单调递增令牌：只有最新一次渲染允许触碰 currentRenderTask
  // 取消上一次未完成的渲染任务，避免快速翻页时旧任务继续向已脱离 DOM 的 canvas 绘制
  if (currentRenderTask) { try { currentRenderTask.cancel(); } catch (e) {} currentRenderTask = null; }
  pageNum = num;  // 立即更新，防止快速连续翻页时重复渲染同一页
  document.getElementById('page-num').textContent = num + ' / ' + totalPages;
  document.getElementById('btn-prev').disabled = num <= 1;
  document.getElementById('btn-next').disabled = num >= totalPages;
  document.getElementById('pages').innerHTML =
    '<div style="text-align:center;padding:40px;color:#aaa;"></div>';
  document.getElementById('pages').firstChild.textContent = T.pageloading;

  pdfDoc.getPage(num).then(function(page) {
    // getPage 期间若又触发了新的 renderPage（页码或令牌已变），跳过本次渲染
    if (pageNum !== num || token !== renderToken) return;
    var viewport = page.getViewport({ scale: scale });
    var canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    var ctx = canvas.getContext('2d');
    if (token !== renderToken) return;
    document.getElementById('pages').innerHTML = '';
    document.getElementById('pages').appendChild(canvas);
    currentRenderTask = page.render({ canvasContext: ctx, viewport: viewport });
    currentRenderTask.promise.then(function() {
      if (token === renderToken) {
        currentRenderTask = null;
        // 延迟清理，避免快速翻页反复 evict 字体/对象缓存
        if (pdfDoc && document.visibilityState === 'visible') {
          clearTimeout(_cleanupTimer);
          _cleanupTimer = setTimeout(function () { try { pdfDoc.cleanup(); } catch (err) {} }, 3000);
        }
      }
    }).catch(function(err) {
      if (token !== renderToken) return;
      currentRenderTask = null;
      // 仅"渲染被取消"（快速翻页）静默；真实失败（worker 崩溃/画布超限）给出提示
      if (err && err.name === 'RenderingCancelledException') return;
      console.error(err);
      showError(T.error, true);
    });
  }).catch(function(err) {
    // 页面获取失败（网络错误/损坏文件）：显示错误而非永久停留在"加载中…"
    if (token !== renderToken) return;
    console.error(err);
    showError(T.error, true);
  });
}

document.getElementById('btn-prev').onclick = function() {
  if (pageNum > 1) renderPage(pageNum - 1);
};
document.getElementById('btn-next').onclick = function() {
  if (pageNum < totalPages) renderPage(pageNum + 1);
};
document.getElementById('btn-zoomin').onclick = function() {
  scale = Math.min(3, scale + 0.2);
  renderPage(pageNum);
};
document.getElementById('btn-zoomout').onclick = function() {
  scale = Math.max(0.5, scale - 0.2);
  renderPage(pageNum);
};

// 响应容器尺寸变化（横竖屏、窗口缩放）
var _resizeTimer = null;
window.addEventListener('resize', function() {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(function() {
    autoScale();
    if (pdfDoc) renderPage(pageNum);
  }, 200);
});
</script>

</body>
</html>
